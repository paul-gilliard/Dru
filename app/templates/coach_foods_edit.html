{% extends 'base.html' %}
{% block title %}Éditer aliment{% endblock %}
{% block content %}
<h2>Éditer aliment: {{ food.name }}</h2>

<div class="card">
  <form method="post" action="{{ url_for('coach_foods_edit', food_id=food.id) }}">
    <div class="row g-2">
      <div class="col-md-6">
        <label for="name">Nom *</label>
        <input id="name" name="name" type="text" class="form-control" value="{{ food.name }}" required>
      </div>
      <div class="col-md-6">
        <label for="brand">Marque</label>
        <input id="brand" name="brand" type="text" class="form-control" value="{{ food.brand or '' }}" placeholder="ex: BiotechUSA, Myprotein...">
      </div>
    </div>
    <div class="row g-2 mt-1">
      <div class="col">
        <label for="kcal">Kcal *</label>
        <input id="kcal" name="kcal" type="number" step="0.1" class="form-control" value="{{ food.kcal }}" required>
      </div>
      <div class="col">
        <label for="proteins">Protéines (g) *</label>
        <input id="proteins" name="proteins" type="number" step="0.1" class="form-control" value="{{ food.proteins }}" required>
      </div>
      <div class="col">
        <label for="lipids">Lipides (g) *</label>
        <input id="lipids" name="lipids" type="number" step="0.1" class="form-control" value="{{ food.lipids }}" required>
      </div>
      <div class="col">
        <label for="carbs">Glucides (g) *</label>
        <input id="carbs" name="carbs" type="number" step="0.1" class="form-control" value="{{ food.carbs }}" required>
      </div>
    </div>
    <div class="row g-2 mt-1">
      <div class="col">
        <label for="saturated_fats">Saturés (g)</label>
        <input id="saturated_fats" name="saturated_fats" type="number" step="0.1" class="form-control" value="{{ food.saturated_fats or '' }}">
      </div>
      <div class="col">
        <label for="simple_sugars">Sucres (g)</label>
        <input id="simple_sugars" name="simple_sugars" type="number" step="0.1" class="form-control" value="{{ food.simple_sugars or '' }}">
      </div>
      <div class="col">
        <label for="fiber">Fibres (g)</label>
        <input id="fiber" name="fiber" type="number" step="0.1" class="form-control" value="{{ food.fiber or '' }}">
      </div>
      <div class="col">
        <label for="salt">Sel (g)</label>
        <input id="salt" name="salt" type="number" step="0.1" class="form-control" value="{{ food.salt or '' }}">
      </div>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Mettre à jour</button>
      <a href="{{ url_for('coach_foods') }}" class="btn btn-secondary ms-2">Retour</a>
    </div>
  </form>
</div>

{% endblock %}
